name: Movo V1.20.2 production deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/movo-v1-20-2-deploy.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited runtime patch
        shell: bash
        run: |
          python3 scripts/deploy_v1202.py
          mkdir -p /tmp/movo-assets
          cd /tmp/movo-assets
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          node - <<'NODE'
          const sharp=require('/tmp/movo-assets/node_modules/sharp');
          const fs=require('fs');
          const svg=fs.readFileSync('assets/movo-symbol.svg');
          Promise.all([
            sharp(svg).resize(180,180).png().toFile('assets/movo-icon-180.png'),
            sharp(svg).resize(192,192).png().toFile('assets/movo-icon-192.png'),
            sharp(svg).resize(512,512).png().toFile('assets/movo-icon-512.png'),
            sharp(svg).resize(420,420).extend({top:46,bottom:46,left:46,right:46,background:'#092c2a'}).png().toFile('assets/movo-maskable-512.png')
          ]).catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check app.js
          node --check sw.js
          grep -q "FIT4US_VERSION='1.20.2'" app.js
          grep -q "const VERSION='1.20.2'" sw.js
          grep -q '"version": "1.20.2"' version.json
          grep -q 'V1.20.2' index.html
          test -s assets/movo-icon-180.png
          test -s assets/movo-icon-192.png
          test -s assets/movo-icon-512.png
          test -s assets/movo-maskable-512.png
          grep -q 'html\[data-theme="dark"\] .focusChallenge.daily' style.css
          grep -q '.historyTop' style.css
          grep -q '.resetDangerCard' style.css
          rm -rf scripts .github/workflows/movo-v1-20-2-deploy.yml
      - name: Commit clean production runtime
        shell: bash
        run: |
          git config user.name "Movo Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Movo v1.20.2: UI consistency and production cleanup"
          git push

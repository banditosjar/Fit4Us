name: Movo V1.21.0 visual refresh deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/movo-v1-21-0-deploy.yml'
      - '.github/v121/**'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Movo V1.21.0 refresh
        shell: bash
        run: |
          cat .github/v121/patch*.txt > /tmp/movo_v121_patch.b64
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          payload=Path('/tmp/movo_v121_patch.b64').read_text().strip()
          exec(zlib.decompress(base64.b64decode(payload)).decode())
          Path('UPDATE_V1_21_0.txt').unlink(missing_ok=True)
          PY
          node --check app.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('app.js').read_text()
          names=re.findall(r'(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s)
          dup=sorted({n for n in names if names.count(n)>1})
          if dup: raise SystemExit('Duplicate functions: '+','.join(dup))
          if "const FIT4US_VERSION='1.21.0'" not in s: raise SystemExit('app version mismatch')
          if "const VERSION='1.21.0'" not in Path('sw.js').read_text(): raise SystemExit('sw version mismatch')
          if json.loads(Path('version.json').read_text())['version']!='1.21.0': raise SystemExit('version.json mismatch')
          required=['assets/movo-symbol.svg','assets/movo-mountain-bg.svg','assets/movo-icon-180.png','assets/movo-icon-192.png','assets/movo-icon-512.png','assets/movo-maskable-512.png']
          missing=[p for p in required if not Path(p).exists()]
          if missing: raise SystemExit('Missing runtime assets: '+','.join(missing))
          PY
      - name: Commit clean production runtime
        shell: bash
        run: |
          rm -rf .github
          git config user.name 'Movo Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Movo v1.21.0: visual identity refresh' || exit 0
          git push

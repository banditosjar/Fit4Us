name: Finalize Movo V1.21.0 momentum label
on:
  push:
    branches: [main]
    paths: ['.github/workflows/movo-v1-21-0-momentum-label.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep mockup visual without inventing a 12-point rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js');s=p.read_text()
          s=s.replace('pct=Math.min(100,Math.round(pts/12*100)),secured=activeDay(today,me.id),s=streak();','pct=Math.min(100,Math.round(pts/8*100)),secured=activeDay(today,me.id),s=streak();')
          s=s.replace('aria-label="${pts} von 12 Tagespunkten"><div><b>${pts} / 12</b><small>Punkte heute</small>','aria-label="${pts} Punkte heute gesammelt"><div><b>${pts} P</b><small>heute gesammelt</small>')
          p.write_text(s)
          if 'von 12 Tagespunkten' in s or '${pts} / 12' in s: raise SystemExit('12-point label still present')
          PY
          node --check app.js
      - name: Commit clean runtime
        shell: bash
        run: |
          rm -rf .github
          git config user.name 'Movo Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Movo v1.21.0: finalize momentum visual' || exit 0
          git push
